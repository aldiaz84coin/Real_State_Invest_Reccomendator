name: Desplegar en Fly

# Los runners de GitHub Actions sí tienen salida libre hacia Fly, así que este
# workflow es la vía de despliegue del proyecto.
on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  # Dos despliegues simultáneos sobre la misma app se pisan: se encola el
  # último y se cancela el anterior si aún no ha terminado.
  group: fly-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Ejecutar tests
        run: pytest -q

      - name: Comprobar que la app arranca
        # Levantar el servidor de verdad detecta errores de importación y de
        # plantillas que los tests unitarios no ven.
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:8000/health
          curl -sf -o /dev/null localhost:8000/
          curl -sf -o /dev/null localhost:8000/simular

  deploy:
    name: Desplegar
    needs: test
    runs-on: ubuntu-latest
    # Sin el secreto configurado el despliegue se salta en vez de fallar, para
    # que el repositorio siga en verde mientras no haya cuenta de Fly.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe el token
        id: check
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            # Un aviso se pierde entre los registros y el workflow sale verde
            # igual, así que un despliegue omitido parecía uno hecho. Va al
            # resumen de la ejecución, que se ve sin abrir nada.
            echo "::warning::Falta el secreto FLY_API_TOKEN; se omite el despliegue."
            {
              echo "## No se ha desplegado"
              echo ""
              echo "Falta el secreto \`FLY_API_TOKEN\`, así que este workflow ha"
              echo "pasado los tests pero **no ha subido nada a Fly**. Lo que esté"
              echo "corriendo sigue siendo la versión anterior."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.listo == 'true'

      - name: Leer nombre y región del fly.toml
        id: cfg
        run: |
          # Se extrae el valor entre comillas: fly launch reescribe el fichero
          # con comillas simples y un borrado de caracteres se comería letras
          # del propio nombre de la app.
          APP=$(sed -n "s/^app *= *['\"]\\(.*\\)['\"].*/\\1/p" fly.toml)
          REGION=$(sed -n "s/^primary_region *= *['\"]\\(.*\\)['\"].*/\\1/p" fly.toml)
          test -n "$APP" || { echo "::error::No se pudo leer 'app' de fly.toml"; exit 1; }
          test -n "$REGION" || { echo "::error::No se pudo leer 'primary_region' de fly.toml"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "App: $APP | Región: $REGION"

      - name: Crear el volumen si no existe
        if: steps.check.outputs.listo == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.cfg.outputs.app }}
          REGION: ${{ steps.cfg.outputs.region }}
        run: |
          # El fly.toml declara [[mounts]], así que sin volumen el despliegue
          # aborta. Se comprueba antes de crear para no acabar con dos.
          if flyctl volumes list -a "$APP" --json | jq -e '.[] | select(.name == "investment_data")' > /dev/null; then
            echo "El volumen investment_data ya existe."
          else
            echo "Creando volumen investment_data en $REGION"
            flyctl volumes create investment_data -a "$APP" --region "$REGION" --size 1 --yes
          fi

      - name: Desplegar
        if: steps.check.outputs.listo == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # El commit va dentro de la imagen para que /version pueda decir qué
        # está corriendo. El panel de Fly ha enseñado metadatos de despliegues
        # anteriores, y eso costó una ronda entera de dudas.
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}

      - name: Asignar IP pública si falta
        if: steps.check.outputs.listo == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.cfg.outputs.app }}
        run: |
          # Sin IP asignada Fly no publica <app>.fly.dev y el dominio da
          # NXDOMAIN aunque el despliegue haya ido bien. Desplegar con
          # --image sobre una app existente no las asigna solo.
          if [ "$(flyctl ips list -a "$APP" --json | jq 'length')" -gt 0 ]; then
            echo "La app ya tiene IP asignada."
          else
            echo "Sin IP: asignando IPv6 y IPv4 compartida."
            flyctl ips allocate-v6 -a "$APP"
            # Compartida a propósito: la IPv4 dedicada se factura aparte.
            flyctl ips allocate-v4 --shared -a "$APP"
          fi
          flyctl ips list -a "$APP"

      - name: Comprobar que lo desplegado es este commit
        if: steps.check.outputs.listo == 'true'
        env:
          APP: ${{ steps.cfg.outputs.app }}
          ESPERADO: ${{ github.sha }}
        run: |
          # Se le pregunta a la propia aplicación en vez de fiarse del panel:
          # la app sabe de qué commit salió su imagen.
          VISTO=$(curl -sf --retry 5 --retry-delay 3 "https://$APP.fly.dev/version" \
                  | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p')
          echo "Esperado: $ESPERADO"
          echo "Corriendo: $VISTO"
          if [ "$VISTO" != "$ESPERADO" ]; then
            echo "::error::Fly está sirviendo $VISTO y este despliegue era $ESPERADO."
            exit 1
          fi
          echo "✓ La versión desplegada coincide."

      - name: Comprobar acceso a las fuentes ya desplegado
        if: steps.check.outputs.listo == 'true'
        env:
          APP: ${{ steps.cfg.outputs.app }}
        run: |
          echo "Sondeando https://$APP.fly.dev/api/sources/health"
          # Reintentos porque la máquina puede estar arrancando en frío.
          curl -sf --retry 8 --retry-delay 5 --retry-all-errors \
            "https://$APP.fly.dev/api/sources/health" -o fuentes.json
          jq -r '.summary | "Operativas: \(.ok)/\(.total) | falta clave: \(.needs_credentials) | sin via publica: \(.unavailable)"' fuentes.json
          jq -r '.sources[] | "  \(.access | .[0:18]) \(.name)"' fuentes.json
          echo "### Fuentes de datos" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.sources[] | "- **\(.name)**: \(.access)"' fuentes.json >> "$GITHUB_STEP_SUMMARY"
